<div class="page-photo">
  <div class="carte-connexion">

    <div class="logo-carte">
      <img src="assets/images/AFB.png" alt="Afriland First Bank">
    </div>
    <h1 class="titre-carte">
      {{ tr.t('forgot.titre1') }}<br>
      <span class="accent">{{ tr.t('forgot.titre2') }}</span>
    </h1>
    <p class="desc-carte">{{ tr.t('forgot.sousTitre') }}</p>

      <!-- Indicateur d'étapes -->
      <div class="steps">
        <div class="step-item" [class.active]="etape >= 1" [class.done]="etape > 1">{{ tr.t('forgot.etape1') }}</div>
        <div class="step-item" [class.active]="etape >= 2" [class.done]="etape > 2">{{ tr.t('forgot.etape2') }}</div>
        <div class="step-item" [class.active]="etape >= 3">{{ tr.t('forgot.etape3') }}</div>
      </div>

      <div *ngIf="info" class="ok">✓ {{ info }}</div>
      <div *ngIf="erreur" class="err">{{ erreur }}</div>

      <!-- ÉTAPE 1 : téléphone -->
      <form *ngIf="etape === 1" (ngSubmit)="envoyerCode()">
        <label for="telephone">{{ tr.t('commun.telephone') }}</label>
        <input class="in" id="telephone" type="tel" name="telephone"
               [(ngModel)]="telephone"
               placeholder="Ex : 690000000" required>
        <button class="lift btn" type="submit" [disabled]="chargement">
          {{ chargement ? tr.t('forgot.envoiEnCours') : tr.t('forgot.recevoirCode') }}
        </button>
      </form>

      <!-- ÉTAPE 2 : code OTP -->
      <form *ngIf="etape === 2" (ngSubmit)="verifierCode()">
        <label for="code">{{ tr.t('forgot.codeLabel') }}</label>
        <input class="in otp" id="code" type="text" name="code" inputmode="numeric"
               maxlength="6" [(ngModel)]="code"
               placeholder="• • • • • •" required>
        <button class="lift btn" type="submit" [disabled]="chargement">
          {{ chargement ? tr.t('forgot.verificationEnCours') : tr.t('forgot.verifierCode') }}
        </button>
        <button type="button" class="fp-link" (click)="renvoyerCode()">
          {{ tr.t('forgot.renvoyerCode') }}
        </button>
      </form>

      <!-- ÉTAPE 3 : nouveau mot de passe -->
      <form *ngIf="etape === 3" (ngSubmit)="reinitialiser()">
        <label for="nouveau">{{ tr.t('forgot.nouveauMdp') }}</label>
        <input class="in m14" id="nouveau" type="password" name="nouveau"
               [(ngModel)]="nouveauMotDePasse" minlength="6" required placeholder="••••••••">

        <label for="confirmation">{{ tr.t('forgot.confirmerMdp') }}</label>
        <input class="in" id="confirmation" type="password" name="confirmation"
               [(ngModel)]="confirmationMotDePasse" minlength="6" required placeholder="••••••••">

        <button class="lift btn" type="submit" [disabled]="chargement">
          {{ chargement ? tr.t('forgot.reinitialisationEnCours') : tr.t('forgot.reinitialiserBtn') }}
        </button>
      </form>

      <a class="fp-retour" routerLink="/connexion">{{ tr.t('forgot.retourConnexion') }}</a>

  </div>          <!-- fin .carte-connexion -->
</div>            <!-- fin .page-photo -->
